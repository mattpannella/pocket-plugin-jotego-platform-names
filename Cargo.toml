[package]
name = "jotego-platform-names"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Sync / pupdate plugin: friendly platform names for Jotego cores (Platforms/*.json)"
publish = false

[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
