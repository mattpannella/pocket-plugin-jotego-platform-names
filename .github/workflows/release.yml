name: Release plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build & attach plugin.wasm + plugin.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo test

      - run: cargo build --release --target wasm32-wasip1

      - name: Attach assets to the release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" target/wasm32-wasip1/release/plugin.wasm --clobber
          gh release upload "${{ github.event.release.tag_name }}" plugin.json --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}
